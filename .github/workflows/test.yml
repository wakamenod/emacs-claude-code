name: test

on:
  # develop is here for the merge itself.  Every pull request is tested,
  # but two of them can each be green and still break once both are in --
  # a function one renamed and the other called.  Without this, that lands
  # on develop and is not seen until the release pull request into main.
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # 29.1 is the minimum the package claims; snapshot is the early warning.
    strategy:
      fail-fast: false
      matrix:
        emacs_version: ['29.1', '29.4', '30.1', 'snapshot']
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.emacs_version == 'snapshot' }}
    steps:
      - uses: actions/checkout@v4

      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs_version }}

      # `make test' needs no dependency of its own: everything it requires
      # is either in Emacs (transient, cl-lib) or optional (`require' with
      # NOERROR).  ELPA points at an empty directory so that nothing on the
      # runner can leak in.
      - name: compile
        run: make compile ELPA=$PWD/.elpa

      - name: test
        run: make test ELPA=$PWD/.elpa

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: purcell/setup-emacs@master
        with:
          version: '30.1'

      # checkdoc prints its findings and exits 0, so that half of the job is
      # a report.  package-lint is installed first, because a check nobody
      # runs is how forty-two stale `Package-Requires' headers and five
      # global modes with no autoload cookie reached a release.  Its errors
      # fail this job; its warnings are printed and do not, for the reasons
      # scripts/lint.el gives.
      - name: lint dependencies
        run: make lint-deps ELPA=$PWD/.elpa

      - name: lint
        run: make lint ELPA=$PWD/.elpa
