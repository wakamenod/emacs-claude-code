name: release

# A tag is the release.  This runs on the tag alone, so that the one thing
# a release can get silently wrong -- a Version header left behind, which
# `package-vc-install' then reports as the old version -- cannot reach
# anybody.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to check
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # A dispatch run works on the tag it was given, not on main: the
      # version it checks and the notes it publishes are the ones that were
      # released, whatever main has moved on to since.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: purcell/setup-emacs@master
        with:
          version: '30.1'

      # The Version header of ecc.el is what package.el reads, and the tag
      # is what everybody else reads.  They have to be the same number.
      - name: version
        run: |
          tag='${{ github.event.inputs.tag || github.ref_name }}'
          header=$(sed -n 's/^;; Version: *//p' ecc.el)
          echo "tag=$tag header=$header"
          if [ "v$header" != "$tag" ]; then
            echo "::error::ecc.el says $header, the tag says $tag"
            exit 1
          fi
          if ! grep -q "^## \[$header\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $header"
            exit 1
          fi

      - name: test
        run: make test ELPA=$PWD/.elpa

      # The notes are the section of CHANGELOG.md for this version: from
      # its heading to the next one.  The heading is matched with index()
      # rather than as a regular expression: awk -v works the escapes out
      # of its value, so a "\\[" written here reaches the program as a "[",
      # the brackets become a character class and the section is silently
      # empty -- which is how v0.1.0 was published with no notes at all
      # (2026-09-12).
      - name: notes
        run: |
          header=$(sed -n 's/^;; Version: *//p' ecc.el)
          awk -v h="## [$header]" '
            index($0, h) == 1 {found = 1; next}
            found && /^## / {exit}
            found {print}
          ' CHANGELOG.md > notes.md
          cat notes.md
          test -s notes.md || { echo "::error::no notes for $header in CHANGELOG.md"; exit 1; }

      # Create the release, or set the notes of one that is already there:
      # a dispatch run is how a release published with the wrong notes is
      # repaired, and it has to be able to finish the job.
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "ecc $TAG" --notes-file notes.md
          else
            gh release create "$TAG" --title "ecc $TAG" --notes-file notes.md
          fi
